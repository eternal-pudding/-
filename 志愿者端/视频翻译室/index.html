<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频翻译室 - 志愿者端</title>
    <link rel="stylesheet" href="../common-nav-volunteer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft Yahei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
        }

        /* 顶部导航在视频页的特殊处理 */
        header {
            background: rgba(10, 10, 10, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .page-container {
            padding-top: 80px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 翻译室信息条 */
        .room-info-bar {
            background: rgba(0, 82, 217, 0.15);
            border-bottom: 1px solid rgba(0, 82, 217, 0.3);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .room-info-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .room-title {
            font-size: 16px;
            font-weight: 600;
        }

        .room-title i {
            color: #0052D9;
            margin-right: 8px;
        }

        .room-meta {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            display: flex;
            gap: 16px;
        }

        .room-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-badge {
            background: #52c41a;
            color: #fff;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .live-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.9); }
        }

        /* 视频区域 */
        .video-area {
            flex: 1;
            display: flex;
            position: relative;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        /* 主视频（求职者/对方） */
        .main-video {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main-video-placeholder {
            text-align: center;
            color: #fff;
        }

        .main-video-placeholder i {
            font-size: 120px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .main-video-placeholder p {
            font-size: 18px;
            opacity: 0.6;
        }

        .main-video-placeholder .sub-text {
            font-size: 14px;
            opacity: 0.4;
            margin-top: 8px;
        }

        /* 小窗口（自己） */
        .self-video {
            position: absolute;
            right: 24px;
            top: 24px;
            width: 280px;
            height: 200px;
            background: #0f0f1a;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .self-video i {
            font-size: 48px;
            color: #fff;
            opacity: 0.3;
        }

        .self-video-label {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-top: 10px;
        }

        /* 通话信息浮层 */
        .call-info {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #fff;
            background: rgba(0,0,0,0.4);
            padding: 14px 20px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }

        .call-info h3 {
            font-size: 18px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .call-duration {
            font-size: 14px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 连接状态 */
        .connecting-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 10;
        }

        .connecting-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #0052D9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* 控制栏 */
        .controls-bar {
            height: 110px;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 0 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .control-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .control-btn.active {
            background: #0052D9;
        }

        .control-btn.end-call {
            background: #ff4d4f;
            width: 70px;
            height: 70px;
            font-size: 28px;
        }

        .control-btn.end-call:hover {
            background: #ff7875;
        }

        .control-label {
            position: absolute;
            bottom: -24px;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
        }

        /* 手语提示条 */
        .sign-tip {
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 82, 217, 0.9);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
            animation: tipFadeIn 0.5s ease;
        }

        @keyframes tipFadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .self-video {
                width: 120px;
                height: 160px;
                right: 12px;
                top: 12px;
            }
            .room-info-bar {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="../翻译工作台/index.html" class="logo">
            <span>Job</span>
            <span>志愿者端</span>
        </a>
        <div class="nav-container">
            <ul class="nav-menu">
                <li><a href="../翻译工作台/index.html">翻译工作台</a></li>
                <li><a href="index.html" class="active">视频翻译室</a></li>
                <li><a href="../消息中心/index.html">消息中心</a></li>
                <li><a href="../新闻/news.html">相关新闻</a></li>
            </ul>
            <a href="../个人主页/个人主页.html" class="nav-avatar" title="个人中心">
                <img src="" alt="头像" id="navAvatar">
            </a>
        </div>
    </header>

    <div class="page-container">
        <!-- 翻译室信息条 -->
        <div class="room-info-bar">
            <div class="room-info-left">
                <div class="room-title"><i class="fas fa-handshake"></i> 手语翻译服务中</div>
                <div class="room-meta">
                    <span><i class="fas fa-user"></i> 张小明</span>
                    <span><i class="fas fa-building"></i> 阿里云计算有限公司</span>
                    <span><i class="fas fa-briefcase"></i> 前端开发工程师</span>
                </div>
            </div>
            <div class="live-badge">翻译进行中</div>
        </div>

        <!-- 视频区域 -->
        <div class="video-area">
            <!-- 通话信息 -->
            <div class="call-info">
                <h3>张小明 · 面试翻译</h3>
                <div class="call-duration" id="callDuration"><i class="far fa-clock"></i> 00:00</div>
            </div>

            <!-- 连接状态 -->
            <div class="connecting-status" id="connectingStatus">
                <div class="connecting-spinner"></div>
                <p>正在接入视频翻译室...</p>
            </div>

            <!-- 主视频（对方/求职者） -->
            <div class="main-video" id="mainVideo">
                <div class="main-video-placeholder">
                    <i class="fas fa-user"></i>
                    <p>求职者摄像头暂未开启</p>
                    <p class="sub-text">手语翻译志愿者请保持画面清晰、网络畅通</p>
                </div>
            </div>

            <!-- 小窗口（自己） -->
            <div class="self-video">
                <i class="fas fa-user"></i>
                <span class="self-video-label">我的手语画面</span>
            </div>

            <!-- 手语提示 -->
            <div class="sign-tip" id="signTip">
                <i class="fas fa-info-circle"></i>
                <span>请保持双手在画面中央，确保求职者和HR都能清晰看到您的手语</span>
            </div>
        </div>

        <!-- 控制栏 -->
        <div class="controls-bar">
            <div class="control-wrapper">
                <button class="control-btn" id="micBtn" title="静音">
                    <i class="fas fa-microphone"></i>
                </button>
                <span class="control-label">静音</span>
            </div>
            <div class="control-wrapper">
                <button class="control-btn" id="videoBtn" title="关闭摄像头">
                    <i class="fas fa-video"></i>
                </button>
                <span class="control-label">视频</span>
            </div>
            <div class="control-wrapper">
                <button class="control-btn end-call" onclick="endCall()" title="结束翻译">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
            <div class="control-wrapper">
                <button class="control-btn" id="speakerBtn" title="扬声器">
                    <i class="fas fa-volume-up"></i>
                </button>
                <span class="control-label">扬声器</span>
            </div>
            <div class="control-wrapper">
                <button class="control-btn" onclick="toggleSignTip()" title="提示">
                    <i class="fas fa-info"></i>
                </button>
                <span class="control-label">提示</span>
            </div>
        </div>
    </div>

    <script>
        let callTimer = null;
        let seconds = 0;

        // 模拟连接过程
        setTimeout(() => {
            document.getElementById('connectingStatus').classList.add('hidden');
            startCallTimer();
        }, 2000);

        function startCallTimer() {
            callTimer = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('callDuration').innerHTML = `<i class="far fa-clock"></i> ${mins}:${secs}`;
            }, 1000);
        }

        function endCall() {
            clearInterval(callTimer);
            if (confirm('确定要结束本次手语翻译服务吗？')) {
                window.location.href = '../翻译工作台/index.html';
            } else {
                startCallTimer();
            }
        }

        // 静音按钮
        let isMuted = false;
        document.getElementById('micBtn').addEventListener('click', function() {
            isMuted = !isMuted;
            this.classList.toggle('active');
            this.innerHTML = isMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
            this.nextElementSibling.textContent = isMuted ? '已静音' : '静音';
        });

        // 视频按钮
        let isVideoOff = false;
        document.getElementById('videoBtn').addEventListener('click', function() {
            isVideoOff = !isVideoOff;
            this.classList.toggle('active');
            this.innerHTML = isVideoOff ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
            this.nextElementSibling.textContent = isVideoOff ? '已关闭' : '视频';
            document.getElementById('mainVideo').querySelector('.main-video-placeholder').style.display = 
                isVideoOff ? 'none' : 'flex';
        });

        // 扬声器按钮
        let isSpeakerOn = true;
        document.getElementById('speakerBtn').addEventListener('click', function() {
            isSpeakerOn = !isSpeakerOn;
            this.classList.toggle('active');
            this.innerHTML = isSpeakerOn ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
            this.nextElementSibling.textContent = isSpeakerOn ? '扬声器' : '静音';
        });

        function toggleSignTip() {
            const tip = document.getElementById('signTip');
            tip.style.display = tip.style.display === 'none' ? 'flex' : 'none';
        }

        // 加载导航头像
        const navAvatar = document.getElementById('navAvatar');
        if (navAvatar) {
            const savedAvatar = localStorage.getItem('userAvatar');
            navAvatar.src = savedAvatar || 'https://api.dicebear.com/7.x/initials/svg?seed=志愿者&backgroundColor=0052D9';
        }

        // 防止意外关闭
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '正在提供手语翻译服务，确定要离开吗？';
        });
    </script>
</body>
</html>
