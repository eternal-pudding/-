<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约面试 - HR招聘中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --primary: #0052D9;
            --primary-light: #2B6DE5;
            --primary-dark: #003BB3;
            --text-white: #FFFFFF;
            --text-gray: #666666;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        /* 导航栏 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 60px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 40px;
            list-style: none;
        }

        .nav-menu a {
            color: #333;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 10px 0;
            display: block;
            transition: var(--transition);
            position: relative;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-menu a:hover::after,
        .nav-menu a.active::after {
            width: 100%;
        }

        .nav-menu a.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            margin-left: 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            transition: var(--transition);
            cursor: pointer;
        }

        .nav-avatar:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .nav-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-avatar img[src=""],
        .nav-avatar img:not([src]) {
            display: none;
        }

        .nav-avatar:empty::before,
        .nav-avatar img[src=""]::before,
        .nav-avatar img:not([src])::before {
            content: '企';
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: var(--primary);
            color: #fff;
            font-size: 14px;
        }

        /* 主内容 */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }

        /* 页面标题 */
        .page-header {
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }

        .page-subtitle {
            font-size: 14px;
            color: #999;
            margin-top: 4px;
        }

        /* 候选人卡片 */
        .candidate-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .candidate-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #f0f0f0;
        }

        .candidate-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .candidate-info {
            flex: 1;
        }

        .candidate-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .candidate-tags {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: #666;
        }

        .candidate-tags span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .candidate-tags i {
            color: #999;
            font-size: 12px;
        }

        .apply-position {
            text-align: right;
        }

        .apply-position .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 2px;
        }

        .apply-position .value {
            font-size: 14px;
            color: var(--primary);
            font-weight: 500;
        }

        /* 表单卡片 */
        .form-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .form-section {
            margin-bottom: 28px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .form-label .required {
            color: #ff4d4f;
            margin-left: 4px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            padding: 12px 16px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            background: #fff;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 82, 217, 0.1);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* 时间选择 */
        .time-slots {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .time-slot {
            padding: 12px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: #fff;
        }

        .time-slot:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .time-slot.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .time-slot.disabled {
            background: #f5f5f5;
            color: #bbb;
            cursor: not-allowed;
        }

        .time-slot .time {
            font-size: 14px;
            font-weight: 500;
        }

        .time-slot .status {
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.8;
        }

        /* 面试方式 */
        .interview-types {
            display: flex;
            gap: 16px;
        }

        .type-option {
            flex: 1;
            padding: 16px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .type-option:hover {
            border-color: var(--primary-light);
        }

        .type-option.selected {
            border-color: var(--primary);
            background: #f0f7ff;
        }

        .type-option i {
            font-size: 24px;
            color: #999;
            margin-bottom: 8px;
        }

        .type-option.selected i {
            color: var(--primary);
        }

        .type-option .type-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .type-option .type-desc {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* 日期选择 */
        .date-picker {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .date-option {
            min-width: 80px;
            padding: 12px 16px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: #fff;
        }

        .date-option:hover {
            border-color: var(--primary);
        }

        .date-option.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .date-option .weekday {
            font-size: 12px;
            margin-bottom: 4px;
        }

        .date-option .date {
            font-size: 16px;
            font-weight: 600;
        }

        /* 提交按钮 */
        .form-actions {
            display: flex;
            gap: 16px;
            padding-top: 24px;
            border-top: 1px solid #f0f0f0;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            border: 1px solid #e8e8e8;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        /* 提示信息 */
        .info-tip {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 16px;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #52c41a;
            font-size: 13px;
        }

        .info-tip i {
            margin-top: 2px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            header {
                padding: 0 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .time-slots {
                grid-template-columns: repeat(2, 1fr);
            }

            .interview-types {
                flex-direction: column;
            }

            .candidate-card {
                flex-wrap: wrap;
            }

            .apply-position {
                width: 100%;
                text-align: left;
                margin-top: 12px;
                padding-top: 12px;
                border-top: 1px solid #f5f5f5;
            }
        }
    </style>
</head>

    <script>
        let selectedType = 'onsite';
        let selectedDate = null;
        let selectedTime = null;

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            initDates();
            initTimeSlots();
            loadNavAvatar();
        });

        // 加载导航栏头像
        function loadNavAvatar() {
            const savedAvatar = localStorage.getItem('userAvatar');
            const headerAvatar = document.getElementById('header-avatar');
            if (savedAvatar && headerAvatar) {
                headerAvatar.src = savedAvatar;
            }
        }

        // 初始化日期选择
        function initDates() {
            const datePicker = document.getElementById('datePicker');
            const today = new Date();
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const weekday = i === 0 ? '今天' : weekdays[date.getDay()];
                const dateStr = date.toISOString().split('T')[0];
                
                const dateEl = document.createElement('div');
                dateEl.className = 'date-option' + (i === 0 ? ' selected' : '');
                dateEl.innerHTML = `
                    <div class="weekday">${weekday}</div>
                    <div class="date">${month}/${day}</div>
                `;
                dateEl.onclick = () => selectDate(dateEl, dateStr);
                datePicker.appendChild(dateEl);
                
                if (i === 0) selectedDate = dateStr;
            }
        }

        // 初始化时间选择
        function initTimeSlots() {
            const timeSlots = document.getElementById('timeSlots');
            const times = [
                { time: '09:00', status: '可预约' },
                { time: '09:30', status: '可预约' },
                { time: '10:00', status: '可预约' },
                { time: '10:30', status: '已约满' },
                { time: '14:00', status: '可预约' },
                { time: '14:30', status: '可预约' },
                { time: '15:00', status: '可预约' },
                { time: '15:30', status: '可预约' }
            ];
            
            times.forEach(item => {
                const slot = document.createElement('div');
                slot.className = 'time-slot' + (item.status === '已约满' ? ' disabled' : '');
                slot.innerHTML = `
                    <div class="time">${item.time}</div>
                    <div class="status">${item.status}</div>
                `;
                if (item.status !== '已约满') {
                    slot.onclick = () => selectTime(slot, item.time);
                }
                timeSlots.appendChild(slot);
            });
        }

        // 选择日期
        function selectDate(el, date) {
            document.querySelectorAll('.date-option').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
            selectedDate = date;
        }

        // 选择时间
        function selectTime(el, time) {
            document.querySelectorAll('.time-slot').forEach(t => t.classList.remove('selected'));
            el.classList.add('selected');
            selectedTime = time;
        }

        // 选择面试方式
        function selectType(el, type) {
            document.querySelectorAll('.type-option').forEach(t => t.classList.remove('selected'));
            el.classList.add('selected');
            selectedType = type;
            
            // 更新地点/链接输入框
            const locationSection = document.getElementById('locationSection');
            const sectionTitle = locationSection.querySelector('.section-title');
            const addressInput = document.getElementById('interviewAddress');
            
            if (type === 'video') {
                sectionTitle.innerHTML = '<i class="fas fa-link"></i> 视频面试链接';
                addressInput.placeholder = '请输入视频面试链接（如腾讯会议、钉钉等）';
                addressInput.value = '';
            } else if (type === 'phone') {
                sectionTitle.innerHTML = '<i class="fas fa-phone"></i> 联系电话';
                addressInput.placeholder = '请输入用于面试的电话号码';
                addressInput.value = '';
            } else {
                sectionTitle.innerHTML = '<i class="fas fa-map-marker-alt"></i> 面试地点';
                addressInput.placeholder = '请输入公司详细地址';
                addressInput.value = '南京市江宁区天元西路199号';
            }
        }

        // 表单提交
        document.getElementById('interviewForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!selectedTime) {
                alert('请选择面试时间');
                return;
            }
            
            const interviewerName = document.getElementById('interviewerName').value;
            const interviewerPhone = document.getElementById('interviewerPhone').value;
            const address = document.getElementById('interviewAddress').value;
            
            if (!interviewerName || !interviewerPhone || !address) {
                alert('请填写完整信息');
                return;
            }
            
            // 模拟提交
            const typeMap = {
                'onsite': '现场面试',
                'video': '视频面试',
                'phone': '电话面试'
            };
            
            alert(`面试邀请已发送！\n\n候选人：李小红\n面试时间：${selectedDate} ${selectedTime}\n面试方式：${typeMap[selectedType]}\n\n系统将自动发送短信和邮件通知候选人。`);
            
            // 跳转回简历列表
            window.location.href = '求职招聘.html';
        });
    </script>
</body>
</html>
