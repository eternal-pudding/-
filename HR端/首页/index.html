        let currentFilter = 'all';

        // 根据名字生成头像颜色
        function generateAvatarColor(name) {
            const colors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
                '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2',
                '#F8B500', '#6C5CE7', '#A29BFE', '#74B9FF', '#00B894'
            ];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        // 获取显示名称的首字母
        function getInitials(name) {
            if (!name) return '?';
            return name.slice(-2);
        }

        // 生成SVG头像
        function generateAvatarSvg(name) {
            const bgColor = generateAvatarColor(name);
            const initials = getInitials(name);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="${bgColor}"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="28" font-family="Arial, sans-serif">${initials}</text></svg>`;
            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        // 渲染候选人列表
        function renderCandidates(filter = 'all') {
            const list = document.getElementById('candidateList');
            let filteredCandidates = candidates;
            
            if (filter === 'communicated') {
                filteredCandidates = candidates.filter(c => c.communicated);
            } else if (filter === 'uncommunicated') {
                filteredCandidates = candidates.filter(c => !c.communicated);
            }
            
            // 按匹配度降序排序
            filteredCandidates.sort((a, b) => b.match - a.match);
            
            list.innerHTML = filteredCandidates.map(candidate => `
                <div class="candidate-card" onclick="viewCandidate(${candidate.id})">
                    <div class="candidate-header">
                        <img src="${generateAvatarSvg(candidate.name)}" alt="${candidate.name}" class="candidate-avatar">
                        <div class="candidate-info">
                            <div class="candidate-name-row">
                                <span class="candidate-name">${candidate.name}</span>
                                <span class="match-score">匹配度 ${candidate.match}%</span>
                            </div>
                            <div class="candidate-meta">
                                <span>${candidate.age}岁</span>
                                <span>|</span>
                                <span>${candidate.education}</span>
                                <span>|</span>
                                <span>${candidate.experience}</span>
                            </div>
                        </div>
                    </div>
                    <div class="candidate-job">
                        <span class="job-label">应聘：</span>
                        <span class="job-title">${candidate.jobTitle}</span>
                    </div>
                    <div class="candidate-tags">
                        <span class="tag disability-tag">${candidate.disability}</span>
                        ${candidate.skills.map(skill => `<span class="tag skill-tag">${skill}</span>`).join('')}
                    </div>
                    <div class="candidate-actions">
                        <button class="btn-view" onclick="event.stopPropagation(); viewResume(${candidate.id})">查看简历</button>
                        <button class="btn-contact" onclick="event.stopPropagation(); contactCandidate(${candidate.id})">立即沟通</button>
                    </div>
                </div>
            `).join('');
        }

        // 筛选候选人
        function filterCandidates(type) {
            currentFilter = type;
            
            // 更新按钮active状态
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 根据type给对应按钮添加active类
            const typeMap = {
                'all': 0,
                'communicated': 1,
                'uncommunicated': 2
            };
            if (tabs[typeMap[type]]) {
                tabs[typeMap[type]].classList.add('active');
            }
            
            renderCandidates(type);
        }

        // 查看候选人详情（跳转简历详情页）
        function viewCandidate(id) {
            window.open(`简历详情.html?id=${id}`, '_blank');
        }

        // 查看简历（跳转简历详情页）
        function viewResume(id) {
            window.open(`简历详情.html?id=${id}`, '_blank');
        }

        // 联系候选人（跳转聊天窗口并带上候选人ID）
        function contactCandidate(id) {
            const candidate = candidates.find(c => c.id === id);
            if (candidate) {
                window.location.href = `../聊天窗口/index.html?candidate=${id}&name=${encodeURIComponent(candidate.name)}&job=${encodeURIComponent(candidate.jobTitle)}`;
            }
        }

        // 轮播图
        const slides = document.querySelectorAll('.hero-slide');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
        }

        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                currentSlide = index;
                showSlide(currentSlide);
            });
        });

        setInterval(nextSlide, 5000);

        // 置顶按钮
        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });

        // 更新消息中心红点
        function updateMessageBadge() {
            const badge = document.querySelector('.message-link .badge');
            if (!badge) return;
            const unreadCount = parseInt(localStorage.getItem('hrUnreadCount') || '0', 10);
            if (unreadCount > 0) {
                badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        // 加载导航栏头像
        function loadNavAvatar() {
            const savedAvatar = localStorage.getItem('userAvatar');
            const headerAvatar = document.getElementById('header-avatar');
            
            if (savedAvatar && headerAvatar) {
                headerAvatar.src = savedAvatar;
            }
            updateMessageBadge();
        }
        
        // 初始化
        renderCandidates();
        loadNavAvatar();

        // 退出登录功能
        function logout() {
            // 清除登录状态
            localStorage.removeItem('loginInfo');
            sessionStorage.removeItem('loginInfo');
            
            // 显示退出提示
            alert('已退出登录');
            
            // 跳转到用户端首页
            window.location.href = '../../用户端/首页/index.html';
