<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频通话 - 就业平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background: #1a1a2e;
            overflow: hidden;
        }

        .video-call-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        /* 视频区域 */
        .video-area {
            flex: 1;
            display: flex;
            position: relative;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        /* 主视频（对方） */
        .main-video {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main-video-placeholder {
            text-align: center;
            color: #fff;
        }

        .main-video-placeholder i {
            font-size: 120px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .main-video-placeholder p {
            font-size: 18px;
            opacity: 0.6;
        }

        /* 小窗口（自己） */
        .self-video {
            position: absolute;
            right: 20px;
            bottom: 100px;
            width: 240px;
            height: 180px;
            background: #0f0f1a;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .self-video i {
            font-size: 48px;
            color: #fff;
            opacity: 0.3;
        }

        /* 通话信息 */
        .call-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #fff;
        }

        .call-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .call-duration {
            font-size: 14px;
            opacity: 0.7;
        }

        /* 返回按钮 */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* 控制栏 */
        .controls-bar {
            height: 100px;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 0 20px;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .control-btn.active {
            background: #0052D9;
        }

        .control-btn.end-call {
            background: #ff4d4f;
            width: 70px;
            height: 70px;
            font-size: 28px;
        }

        .control-btn.end-call:hover {
            background: #ff7875;
        }

        .control-label {
            position: absolute;
            bottom: -24px;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
        }

        .control-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 连接状态 */
        .connecting-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
        }

        .connecting-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #0052D9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="video-call-container">
        <div class="video-area">
            <!-- 返回按钮 -->
            <a href="javascript:history.back()" class="back-btn" title="返回">
                <i class="fas fa-arrow-left"></i>
            </a>

            <!-- 通话信息 -->
            <div class="call-info">
                <h3>张小明</h3>
                <div class="call-duration" id="callDuration">00:00</div>
            </div>

            <!-- 连接状态 -->
            <div class="connecting-status" id="connectingStatus">
                <div class="connecting-spinner"></div>
                <p>正在连接...</p>
            </div>

            <!-- 主视频（对方） -->
            <div class="main-video" id="mainVideo">
                <div class="main-video-placeholder">
                    <i class="fas fa-user"></i>
                    <p>对方摄像头已关闭</p>
                </div>
            </div>

            <!-- 小窗口（自己） -->
            <div class="self-video">
                <i class="fas fa-user"></i>
            </div>
        </div>

        <!-- 控制栏 -->
        <div class="controls-bar">
            <div class="control-wrapper">
                <button class="control-btn" id="micBtn" title="静音">
                    <i class="fas fa-microphone"></i>
                </button>
                <span class="control-label">静音</span>
            </div>
            <div class="control-wrapper">
                <button class="control-btn" id="videoBtn" title="关闭摄像头">
                    <i class="fas fa-video"></i>
                </button>
                <span class="control-label">视频</span>
            </div>
            <div class="control-wrapper">
                <button class="control-btn end-call" onclick="endCall()" title="结束通话">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
            <div class="control-wrapper">
                <button class="control-btn" id="speakerBtn" title="扬声器">
                    <i class="fas fa-volume-up"></i>
                </button>
                <span class="control-label">扬声器</span>
            </div>
            <div class="control-wrapper">
                <button class="control-btn" title="切换摄像头">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <span class="control-label">切换</span>
            </div>
        </div>
    </div>

    <script>
        let callTimer = null;
        let seconds = 0;

        // 模拟连接过程
        setTimeout(() => {
            document.getElementById('connectingStatus').classList.add('hidden');
            startCallTimer();
        }, 2000);

        // 开始计时
        function startCallTimer() {
            callTimer = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('callDuration').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        // 结束通话
        function endCall() {
            clearInterval(callTimer);
            if (confirm('确定要结束通话吗？')) {
                history.back();
            } else {
                startCallTimer();
            }
        }

        // 静音按钮
        let isMuted = false;
        document.getElementById('micBtn').addEventListener('click', function() {
            isMuted = !isMuted;
            this.classList.toggle('active');
            this.innerHTML = isMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
            this.nextElementSibling.textContent = isMuted ? '已静音' : '静音';
        });

        // 视频按钮
        let isVideoOff = false;
        document.getElementById('videoBtn').addEventListener('click', function() {
            isVideoOff = !isVideoOff;
            this.classList.toggle('active');
            this.innerHTML = isVideoOff ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
            this.nextElementSibling.textContent = isVideoOff ? '已关闭' : '视频';
            
            // 切换主视频显示
            document.getElementById('mainVideo').querySelector('.main-video-placeholder').style.display = 
                isVideoOff ? 'none' : 'flex';
        });

        // 扬声器按钮
        let isSpeakerOn = true;
        document.getElementById('speakerBtn').addEventListener('click', function() {
            isSpeakerOn = !isSpeakerOn;
            this.classList.toggle('active');
            this.innerHTML = isSpeakerOn ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
            this.nextElementSibling.textContent = isSpeakerOn ? '扬声器' : '静音';
        });

        // 防止意外关闭
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '正在通话中，确定要离开吗？';
        });
    </script>
</body>
</html>
