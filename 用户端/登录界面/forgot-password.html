<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 手语翻译与求职平台</title>
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="top-nav">
        <div class="logo"></div>
        <div class="nav-links">
            <a href="login.html">返回登录</a>
        </div>
    </nav>

    <!-- 背景轮播 -->
    <div class="hero-bg">
        <div class="bg-slide active" style="background-image: url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=2144');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=2144');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?q=80&w=2144');"></div>
        <div class="bg-overlay"></div>
    </div>

    <!-- 忘记密码区域 -->
    <div class="fp-container">
        <div class="fp-box">
            <h2 class="fp-title">重设密码</h2>
            <p class="fp-subtitle">请输入您的手机号或邮箱，我们将发送验证码帮您重置密码</p>
            
            <form>
                <div class="input-group">
                    <input type="text" placeholder="请输入您的手机号或邮箱" required>
                </div>
                <div class="input-group verification-group">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="请输入验证码" required>
                    <button type="button" class="get-code-btn">获取验证码</button>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="请输入新密码" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="请确认新密码" required>
                </div>
                <button type="submit" class="reset-btn">确认修改</button>
            </form>

            <div class="footer-links">
                <span>想起密码了？</span>
                <a href="login.html">返回登录</a>
            </div>
        </div>
    </div>

    <!-- 底部信息 -->
    <footer class="fp-footer">
        <p>我们致力于为残障人士提供便捷的求职和交流服务</p>
    </footer>

    <script>
        // 背景轮播
        const bgSlides = document.querySelectorAll('.bg-slide');
        let currentSlide = 0;

        function showSlide(index) {
            bgSlides.forEach((slide, i) => {
                slide.classList.remove('active');
                if (i === index) {
                    slide.classList.add('active');
                }
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % bgSlides.length;
            showSlide(currentSlide);
        }

        setInterval(nextSlide, 5000);

        // 验证码倒计时
        const getCodeBtn = document.querySelector('.get-code-btn');
        if (getCodeBtn) {
            getCodeBtn.addEventListener('click', () => {
                let countdown = 60;
                getCodeBtn.disabled = true;
                getCodeBtn.textContent = `${countdown}s后重试`;

                const timer = setInterval(() => {
                    countdown--;
                    if (countdown <= 0) {
                        clearInterval(timer);
                        getCodeBtn.disabled = false;
                        getCodeBtn.textContent = '获取验证码';
                    } else {
                        getCodeBtn.textContent = `${countdown}s后重试`;
                    }
                }, 1000);
            });
        }
    </script>
</body>
</html>
